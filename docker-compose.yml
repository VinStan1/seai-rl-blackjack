services:
  test:
    build: .
    command: python -m unittest discover -s tests -v

  train:
    build: .
    command: python -m src.train
    volumes:
      - ./results:/app/results
      - ./experiments:/app/experiments

  evaluate:
    build: .
    command: python -m src.evaluate
    volumes:
      - ./results:/app/results
      - ./experiments:/app/experiments