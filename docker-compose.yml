services:
  test:
    build: .
    command: python -m unittest discover -s tests -v

  train:
    build: .
    command: python -m src.train
    volumes:
      - ./results:/app/results
      - ./experiments:/app/experiments

  evaluate:
    build: .
    command: python -m src.evaluate
    volumes:
      - ./results:/app/results
      - ./experiments:/app/experiments

  sweep:
    build: .
    entrypoint: ["python", "-m", "src.sweep"]
    command: ["--config", "experiments/hyperparameter_sweep.json"]
    volumes:
      - ./results:/app/results
      - ./experiments:/app/experiments:ro

  analyze:
    build: .
    entrypoint: ["python", "-m", "src.analyze"]
    command: ["--summary", "latest"]
    volumes:
      - ./results:/app/results

  final:
    build: .
    entrypoint: ["python", "-m", "src.final_experiment"]
    command: ["--summary", "latest"]
    volumes:
      - ./results:/app/results
